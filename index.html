<body>
<style>
:root{
  --ground:#121418; --surface:#1b1f24; --surface2:#242a31;
  --line:#2c333b; --line2:#3d464f;
  --ink:#e9ecef; --muted:#97a0aa; --steel:#8b949f;
  --torch:#e3a03c; --bead:#ffe9b0;
  --ok:#5aab7e; --bad:#c9483f;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",sans-serif;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun","Microsoft YaHei",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Noto Sans SC",monospace;
  --ui:15px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
[data-mode="stage"]{--ui:19px}

/* ---------- 平板：手指够得着 ---------- */
body{touch-action:manipulation;-webkit-touch-callout:none}
#cv,.knob{touch-action:none}
[data-ui="touch"]{--ui:17px}
[data-ui="touch"][data-mode="stage"]{--ui:19px}
[data-ui="touch"] .b{padding:12px 18px;border-radius:8px}
[data-ui="touch"] .b.sm{padding:11px 14px}
[data-ui="touch"] .nav button{padding:9px 18px;font-size:.84em}
[data-ui="touch"] .modesw button{padding:9px 17px;font-size:.8em}
[data-ui="touch"] .fsbtn{padding:9px 17px;font-size:.8em}
[data-ui="touch"] .dock{gap:12px 18px;padding:14px 16px}
[data-ui="touch"] .knob{width:112px;height:112px}
[data-ui="touch"] .hud .row{padding:7px 14px}
[data-ui="touch"] .blind .port{width:120px;height:120px;margin:-60px 0 0 -60px}
[data-ui="touch"] .blind .plabel{top:calc(50% + 76px)}
[data-ui="touch"] .whiteline{width:266px;height:266px;margin:-133px 0 0 -133px}
@media(max-width:600px){[data-ui="touch"] .knob{width:88px;height:88px}}

/* ---------- 大屏：只剩画面和结论 ---------- */
[data-role="screen"]{--ui:23px}
[data-role="screen"] .dock,[data-role="screen"] .panel,[data-role="screen"] .hint,
[data-role="screen"] .modesw{display:none!important}
[data-role="screen"] .split{grid-template-columns:1fr}
[data-role="screen"] .app{padding-inline:20px;padding-block:0 18px}
[data-role="screen"] .nav button{pointer-events:none}
[data-role="screen"] .hud{left:22px;top:22px;gap:9px}
[data-role="screen"] .hud .row{padding:9px 18px}
[data-role="screen"] .verdict{left:22px;right:22px;bottom:22px;padding:18px 26px}
[data-role="screen"] .verdict .big{font-size:1.5em}
[data-role="screen"] .verdict .sm{display:block!important;font-size:.98em;line-height:1.55}
[data-role="screen"] #cv{cursor:default}
[data-role="screen"] .xsec{width:268px;top:96px}
[data-role="screen"] .blind .port{width:180px;height:180px;margin:-90px 0 0 -90px}
[data-role="screen"] .blind .plabel{top:calc(50% + 112px);font-size:.5em}
[data-role="screen"] .whiteline{width:330px;height:330px;margin:-165px 0 0 -165px}
[data-role="screen"] .holelbl{font-size:.62em}

/* 联动状态 */
.netchip{font-family:var(--mono);font-size:.68em;letter-spacing:.06em;border:1px solid var(--line2);
  border-radius:999px;padding:5px 12px;color:var(--steel);white-space:nowrap;margin-left:8px}
.netchip.ok{border-color:#3d6b53;color:#7fc79f;background:rgba(40,80,60,.25)}
.netchip.no{border-color:#6b3a36;color:#d08f88;background:rgba(80,40,38,.22)}
.waitscr{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;background:rgba(10,12,15,.97);text-align:center;padding:24px}
.waitscr.on{display:flex}
.waitscr .wt{font-family:var(--serif);font-size:1.45em;color:var(--ink)}
.waitscr .wu{font-family:var(--mono);font-size:1.9em;font-weight:700;color:var(--torch);
  border:2px dashed var(--line2);border-radius:12px;padding:16px 28px;word-break:break-all;line-height:1.3}
.waitscr .wp{font-size:.8em;color:var(--muted);max-width:34em;line-height:1.85}

.app{display:flex;flex-direction:column;height:100%;padding-inline:16px;padding-block:0 14px;max-width:1600px;margin:0 auto}

/* ---------- top ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:30}
.logo{font-family:var(--mono);font-size:.7em;letter-spacing:.12em;color:var(--steel)}
.logo b{color:var(--torch);font-weight:500}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav button{font-family:var(--mono);font-size:.78em;border:1px solid var(--line2);border-radius:5px;padding:5px 14px;color:var(--muted)}
.nav button:hover{border-color:var(--steel);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--torch);border-color:var(--torch);color:#1a1205;font-weight:700}
.modesw{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;margin-left:8px}
.modesw button{padding:5px 14px;font-size:.74em;color:var(--muted);font-family:var(--mono)}
.modesw button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);font-weight:700}
.fsbtn{border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:.74em;font-family:var(--mono);color:var(--muted);margin-left:8px;white-space:nowrap}
.fsbtn:hover{border-color:var(--steel);color:var(--ink)}
.fsbtn[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
[data-fs="faux"] .app{position:fixed;inset:0;max-width:none;z-index:900;background:var(--ground);height:100%;padding-inline:16px}
[data-fs="faux"] body{overflow:hidden}

/* ---------- layout ---------- */
.split{display:grid;grid-template-columns:1fr 340px;gap:14px;flex:1;min-height:0}
[data-mode="stage"] .split{grid-template-columns:1fr}
[data-mode="stage"] .panel{display:none}
@media(max-width:940px){.split{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}

/* ---------- stage ---------- */
.stage{position:relative;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#0c0e11;flex:1;min-height:0;min-width:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:14px;top:14px;z-index:6;font-family:var(--mono);pointer-events:none;display:flex;flex-direction:column;gap:6px}
.hud .row{background:rgba(10,12,15,.84);border:1px solid var(--line);border-radius:5px;padding:6px 12px;display:flex;gap:10px;align-items:baseline}
.hud .lab{color:var(--steel);font-size:.62em;letter-spacing:.08em}
.hud .val{font-size:1.35em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hud .val.s{font-size:.95em}
.hud .val.ok{color:var(--ok)} .hud .val.bad{color:var(--bad)} .hud .val.warn{color:var(--torch)}

.verdict{position:absolute;left:14px;right:14px;bottom:14px;z-index:6;pointer-events:none;
  border-radius:6px;padding:12px 16px;border:1px solid;font-weight:500;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.verdict.show{opacity:1;transform:none}
.verdict.ok{border-color:var(--ok);background:rgba(27,53,41,.94);color:#c6e8d6}
.verdict.bad{border-color:var(--bad);background:rgba(54,30,28,.94);color:#f0bab4}
.verdict.info{border-color:var(--line2);background:rgba(28,33,39,.94);color:var(--muted)}
.verdict b{color:#fff}
.verdict .big{display:block;font-family:var(--serif);font-size:1.25em;margin-bottom:2px}
[data-mode="stage"] .verdict .sm{display:none}

@media(max-width:700px){.hint{display:none}}
.hint{position:absolute;right:14px;top:14px;z-index:6;font-family:var(--mono);font-size:.62em;color:#5e666f;pointer-events:none;text-align:right;line-height:1.7}

/* blind cover */
.blind{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}
.blind.on{opacity:1}
.blind .port{pointer-events:none;position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  box-shadow:0 0 0 9999px #05070a, inset 0 0 18px rgba(0,0,0,.95);border:1px solid #2a2f36}
.blind .plabel{position:absolute;left:50%;top:calc(50% + 58px);transform:translateX(-50%);font-family:var(--mono);font-size:.64em;color:#5d666f;letter-spacing:.12em}
.blind.bead .port{background:radial-gradient(circle at 50% 46%, rgba(168,24,50,.42) 0%, rgba(116,16,34,.40) 46%, rgba(38,6,14,.62) 80%, rgba(8,3,5,.82) 100%)}
.blind.glow .port{box-shadow:0 0 20px 4px rgba(255,44,76,.30), 0 0 0 9999px #05070a, inset 0 0 16px rgba(255,30,62,.34);border-color:#70222f}
.blind.glow .plabel{color:#9c5461}
.blind.lit .port{box-shadow:0 0 56px 15px rgba(255,48,82,.62), 0 0 0 9999px #05070a, inset 0 0 22px rgba(255,64,96,.55);border:2px solid #ff5470}
.blind.lit .plabel{color:#ff8fa3}
.beam{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .22s}
.beam.on{opacity:1}
#lensG{filter:drop-shadow(0 0 4px rgba(255,70,102,.9)) drop-shadow(0 0 15px rgba(255,26,64,.55))}
.xsec{position:absolute;z-index:5;pointer-events:none;right:14px;top:78px;width:178px;
  background:rgba(10,12,15,.9);border:1px solid var(--line);border-radius:8px;padding:8px;
  display:flex;gap:6px;opacity:0;transition:opacity .3s}
.xsec.on{opacity:1}
.xcol{flex:1;min-width:0}
.xcol svg{width:100%;height:auto;display:block}
[data-mode="stage"] .xsec{width:226px;top:88px}
@media(max-width:820px){.xsec{width:118px;top:64px;padding:5px;gap:4px}}
.xseccap{position:absolute;z-index:5;pointer-events:none;right:14px;top:56px;
  font-family:var(--mono);font-size:.62em;color:var(--steel);opacity:0;transition:opacity .3s}
.xseccap.on{opacity:1}
[data-mode="stage"] .xseccap{top:62px}
@media(max-width:820px){.xseccap{display:none}}
.holelbl{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:.78em;font-weight:700;width:1.9em;height:1.9em;border-radius:50%;
  display:grid;place-items:center;border:2px solid;background:rgba(8,10,13,.92);opacity:0;transition:opacity .3s}
.holelbl.on{opacity:1}
.holelbl.f{color:#ffcc55;border-color:#ffcc55}
.holelbl.r{color:#62e0a0;border-color:#62e0a0}
[data-mode="stage"] .holelbl{font-size:.82em}
.whiteline{position:absolute;z-index:4;pointer-events:none;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;opacity:0;transition:opacity .3s}
.whiteline.on{opacity:1}

/* ---------- dock (all controls live here) ---------- */
.dock{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:100%}
.dock{min-width:0}
.dock .sep{display:none}
@media(min-width:760px){.dock .sep{display:block}}
.grp{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.grp>.cap{font-family:var(--mono);font-size:.66em;letter-spacing:.08em;color:var(--steel);white-space:nowrap}
.grp.wide{flex:1 1 260px;min-width:0}
.b{border:1px solid var(--line2);border-radius:6px;padding:8px 14px;font-size:.88em;white-space:nowrap;max-width:100%;transition:border-color .15s,background .15s,color .15s}
.b:hover{border-color:var(--steel);background:var(--surface2)}
.b.on{border-color:var(--torch);color:var(--torch);background:rgba(227,160,60,.09);font-weight:700}
.b.pri{background:var(--torch);border-color:var(--torch);color:#1a1205;font-weight:700}
.b.pri:hover{filter:brightness(1.08);background:var(--torch)}
.b:disabled{opacity:.35;cursor:default}
.b.sm{padding:7px 11px;font-family:var(--mono);font-size:.8em}
.knobgrp{gap:13px;align-items:center}
.knob{position:relative;width:94px;height:94px;flex:0 0 auto;border-radius:50%;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.knob:active{cursor:grabbing}
.knob svg{display:block;width:100%;height:100%;overflow:visible}
.knob:focus-visible{outline:2px solid var(--torch);outline-offset:4px}
.knob .kmeas{transition:opacity .2s}
.knob .kline{opacity:0;transition:opacity .2s}
.knob .kq{opacity:0;fill:#6a737d;font-family:var(--mono);font-size:15px;font-weight:700}
.knob.blindk .kmeas{opacity:0}
.knob.blindk .kq{opacity:1}
.knob.blindk.linek .kline{opacity:1}
.knob.blindk.linek .kq{opacity:0}
.knobrd{display:flex;flex-direction:column;gap:7px;align-items:flex-start;min-width:0}
.knobrd .nudge{display:flex;gap:6px;align-items:center}
.ktip{font-family:var(--mono);font-size:.62em;letter-spacing:.08em;color:#5e666f;white-space:nowrap}
[data-mode="stage"] .knob{width:108px;height:108px}
@media(max-width:940px){.knob{width:82px;height:82px}.ktip{display:none}}
.rd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.95em;min-width:4.6em;text-align:right}
.sep{width:1px;align-self:stretch;background:var(--line);margin-inline:2px}

/* ---------- panel (text only) ---------- */
.panel{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;overflow:auto}
.card{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.card.hot{border-left:3px solid var(--torch)}
.eyebrow{font-family:var(--mono);font-size:.68em;letter-spacing:.16em;color:var(--torch)}
h2{font-family:var(--serif);font-size:1.2em;margin:0;line-height:1.35;text-wrap:balance}
h3{font-size:.95em;margin:0;font-weight:700}
.panel p{margin:0;font-size:.88em;color:var(--muted)}
.panel p b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* ---------- 手机：整页上下滚，画面固定高度，讲解排在下面 ---------- */
@media(max-width:940px){
  :root{--ui:15px}
  html,body{height:auto}
  .app{height:auto;min-height:100%;padding-inline:12px}
  .split{min-height:0}
  .split>.panel{display:flex;overflow:visible;padding-bottom:14px}
  .left>.stage{flex:none;height:52vh;min-height:300px}
  .stage>.verdict{font-size:.8em;padding:9px 12px;left:10px;right:10px;bottom:10px}
  .stage>.verdict .big{font-size:1.1em}
  .stage>.hud{gap:4px;left:10px;top:10px}
  .stage>.hud .row{padding:4px 8px}
  .stage>.hud .val{font-size:1.05em}
}
[data-mode="stage"] .split>.panel{display:none}

/* ==================================================================
   竖屏单页 / 大号触摸控件：原业务、3D 装配与双屏同步逻辑完全沿用。
   原生页面不滚动；“详解”仅占三维画面区域，有独立文字滚动。
   仅调整排版和输入控件（圆盘改为水平滑杆）。
   ================================================================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.left,.split,.dock,.grp,.panel{min-width:0}
.blind:not(.on){visibility:hidden}
@supports(height:100dvh){.app{height:100dvh}}

/* 水平滑杆：鼠标、单指、键盘、滚轮均可控制。*/
.grp-turn{gap:10px}
.angle-widget{position:relative;min-width:120px;flex:1 1 240px;display:flex;
  flex-direction:column;justify-content:center;gap:4px;touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:ew-resize;padding:5px 8px}
.angle-widget:focus-visible{outline:3px solid var(--torch);outline-offset:1px;border-radius:10px}
.angle-track{position:relative;width:100%;height:20px;border:1px solid #6b7783;border-radius:999px;
  background:linear-gradient(90deg,#232b33,#323d47);box-shadow:inset 0 1px 5px #080b0e;}
.angle-center{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#ffcc55;opacity:.8}
.angle-progress{position:absolute;left:50%;top:0;bottom:0;width:0;border-radius:999px;
  background:rgba(98,224,160,.42);pointer-events:none}
.angle-thumb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;background:#e3a03c;border:3px solid #ffe6b3;border-radius:11px;
  box-shadow:0 1px 6px #0009;pointer-events:none}
.angle-widget:active .angle-thumb{background:#ffca73}
.angle-scale{display:flex;justify-content:space-between;font:600 12px/1.15 var(--mono);
  color:#c3cbd3;padding:0 1px;white-space:nowrap}
/* 盖板只遮挡箱内场景，水平滑块和刻度始终显示真实转角。 */
.knobrd{flex-direction:row;align-items:center;gap:9px}
.knobrd .nudge{gap:7px}
.knobrd .nudge .b{min-width:44px;min-height:44px}
.rd{min-width:4.8em;text-align:center;font-size:1.05em;font-weight:700;color:var(--torch)}
.ktip{font-size:.78em;color:#c3cbd3}

@media(max-width:1199px){

  html:not([data-role="screen"]) .split{

    gap:var(--gap,6px);height:auto;min-height:0;overflow:hidden;
  }
  html:not([data-role="screen"]) .left{display:contents}
  html:not([data-role="screen"]) .left>.stage{
    grid-area:1/1/2/2;position:relative;top:auto;flex:none;
    width:100%;height:100%;min-height:0;min-width:0;z-index:1;border-radius:8px;
  }
  html:not([data-role="screen"]) .split>.panel{
    grid-area:1/1/2/2;position:relative;inset:auto;z-index:14;
    width:100%;height:100%;min-height:0;min-width:0;
    display:none;flex-direction:column;overflow:auto;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:7px;background:var(--ground);border:1px solid var(--line2);border-radius:8px;
  }
  html:not([data-role="screen"])[data-mode="full"] .split>.panel{display:flex}
  html:not([data-role="screen"])[data-mode="stage"] .split>.panel{display:none}
  html:not([data-role="screen"]) .panel .card{padding:10px 12px;gap:7px}
  html:not([data-role="screen"]) .panel p{font-size:var(--panel-fs,15px);line-height:1.58}
  html:not([data-role="screen"]) .panel h2{font-size:1.3em}
  html:not([data-role="screen"]) .panel h3{font-size:1.08em}
  html:not([data-role="screen"]) .panel .eyebrow{font-size:.89em}
  html:not([data-role="screen"]) .left>.dock,
  html:not([data-role="screen"])[data-ui="touch"] .left>.dock{
    grid-area:2/1/3/2;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:stretch;align-content:center;gap:var(--group-gap,6px);
    width:100%;min-width:0;max-width:none;min-height:0;
    padding:var(--dock-pad,7px);margin:0;overflow:visible;border-radius:8px;
  }
  html:not([data-role="screen"]) .dock>.sep{display:none}
  html:not([data-role="screen"]) .dock>.grp{
    display:flex;flex-wrap:nowrap;align-items:center;align-content:center;
    min-width:0;width:100%;margin:0;padding:0;border:0;gap:var(--btn-gap,5px);
  }
  html:not([data-role="screen"]) .dock>.grp.wide{flex:initial;grid-column:auto}
  html:not([data-role="screen"]) .dock .cap{
    font-size:var(--cap-fs,14px);font-weight:700;letter-spacing:0;line-height:1.2;
    flex:0 0 auto;width:auto;white-space:nowrap;color:#d5dce3;
  }
  html:not([data-role="screen"]) .dock .b,
  html:not([data-role="screen"])[data-ui="touch"] .dock .b,
  html:not([data-role="screen"]) .dock .b.sm,
  html:not([data-role="screen"])[data-ui="touch"] .dock .b.sm{

    white-space:normal;overflow-wrap:anywhere;text-align:center;

  html:not([data-role="screen"]) .dock .b.pri{font-weight:800}
  html:not([data-role="screen"]) .dock .grp-turn{

  html:not([data-role="screen"]) .grp-turn>.cap{grid-area:angleTitle}
  html:not([data-role="screen"]) .dock .angle-widget{

    flex:auto;gap:2px;
  }
  html:not([data-role="screen"]) .angle-track{height:var(--track-h,18px)}
  html:not([data-role="screen"]) .angle-thumb{width:var(--thumb-size,30px);height:var(--thumb-size,30px)}
  html:not([data-role="screen"]) .angle-scale{font-size:var(--scale-fs,12px)}
  html:not([data-role="screen"]) .dock .knobrd{
    grid-area:angleRead;display:flex;flex-direction:row;

  html:not([data-role="screen"]) .dock .knobrd .nudge{display:flex;gap:5px}
  html:not([data-role="screen"]) .dock .knobrd .nudge .b{

    height:var(--nudge-h,44px);padding:0 3px;
  }
  html:not([data-role="screen"]) .dock .rd{
    min-width:3.7em;font-size:var(--rd-fs,17px);font-weight:800;line-height:1.1;text-align:center;
  }
  html:not([data-role="screen"]) .dock .ktip{display:none}

  html:not([data-role="screen"]) .stage>.verdict .sm{display:none}

  html:not([data-role="screen"])[data-ui="touch"] .blind .plabel{

/* 手机竖屏：四孔/试插等按钮按两列排列，避免小按钮挤在一行。 */
@media(max-width:639px){
  html:not([data-role="screen"]){
    --ctl-h:clamp(42px,5.9dvh,52px);--gap:4px;--group-gap:4px;
    --btn-gap:4px;--dock-pad:5px;
    --logo-fs:clamp(11px,3.4vw,14px);--top-fs:clamp(12px,3.65vw,15px);
    --cap-fs:clamp(12px,3.7vw,15px);--btn-fs:clamp(12px,3.7vw,15.5px);
    --nudge-w:clamp(39px,11vw,46px);--nudge-h:clamp(39px,5.8dvh,46px);
    --rd-fs:clamp(15px,4.3vw,18px);--thumb-size:30px;--track-h:19px;
    --scale-fs:12px;--hud-fs:13px;--hud-lab-fs:11px;
    --hud-val-fs:16px;--hud-val-sm-fs:13px;
    --tip-fs:clamp(13px,3.8vw,16px);--tip-title-fs:clamp(15px,4.3vw,19px);
    --panel-fs:clamp(14px,3.7vw,16px);
  }
  html:not([data-role="screen"]) .left>.dock,
  html:not([data-role="screen"])[data-ui="touch"] .left>.dock{
    grid-template-columns:minmax(0,1fr);
  }
  html:not([data-role="screen"]) .dock>.grp-cover{
    display:grid;grid-template-columns:minmax(58px,.7fr) repeat(2,minmax(0,1fr));
  }
  html:not([data-role="screen"]) .dock>.grp-view{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:var(--ctl-h);
  }
  html:not([data-role="screen"]) .dock>.grp-turn{grid-column:1}
  html:not([data-role="screen"]) .dock>.grp-method{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:var(--ctl-h);
  }
  html:not([data-role="screen"]) .dock>.grp-method>.cap{display:none}
  html:not([data-role="screen"]) .dock>.grp-method>.b:nth-of-type(-n+3){grid-column:span 2}
  html:not([data-role="screen"]) .dock>.grp-method>.b:nth-of-type(n+4){grid-column:span 3}
  html:not([data-role="screen"]) .dock>.grp-orient{
    display:grid;grid-template-columns:minmax(48px,.55fr) repeat(2,minmax(0,1fr));
  }
  html:not([data-role="screen"]) .dock>.grp-impact{
    display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  }
  html:not([data-role="screen"]) .stage>.hud{max-width:calc(100% - 108px)}
}
/* 平板竖屏：大按键的双栏操作区，步骤2滑杆单独占整行。 */
@media(min-width:640px) and (max-width:1199px){
  html:not([data-role="screen"]){
    --ctl-h:clamp(48px,5.5dvh,62px);--gap:7px;--group-gap:8px;
    --btn-gap:6px;--dock-pad:9px;--btn-fs:clamp(14px,1.75vw,19px);
    --top-fs:clamp(15px,1.8vw,20px);--logo-fs:16px;--cap-fs:15px;
    --nudge-w:clamp(48px,5.7vw,60px);--nudge-h:clamp(46px,5.1dvh,56px);
    --rd-fs:19px;--thumb-size:40px;--track-h:25px;--scale-fs:15px;
    --hud-fs:17px;--hud-lab-fs:14px;--hud-val-fs:23px;
    --hud-val-sm-fs:18px;--tip-fs:19px;--tip-title-fs:24px;--panel-fs:18px;
  }
  html:not([data-role="screen"]) .dock>.grp-cover{grid-column:1;grid-row:1}
  html:not([data-role="screen"]) .dock>.grp-view{
    grid-column:2;grid-row:1;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:var(--ctl-h);
  }
  html:not([data-role="screen"]) .dock>.grp-turn{grid-column:1;grid-row:2}
  html:not([data-role="screen"]) .dock>.grp-method{
    grid-column:2;grid-row:2;display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto repeat(2,var(--ctl-h));
    align-content:center;
  }
  html:not([data-role="screen"]) .dock>.grp-method .cap{grid-column:1/-1;width:100%}
  html:not([data-role="screen"]) .dock>.grp-method .b:nth-of-type(-n+3){grid-column:span 2}
  html:not([data-role="screen"]) .dock>.grp-method .b:nth-of-type(n+4){grid-column:span 3}
  html:not([data-role="screen"]) .dock>.grp-orient{grid-column:1;grid-row:2}
  html:not([data-role="screen"]) .dock>.grp-impact{grid-column:2;grid-row:2}
  /* 销向步骤中不存在 view/method, 按此选择器将 slider 横跨两列。 */
  html:not([data-role="screen"]) .dock[data-step="1"]>.grp-turn{
    grid-column:1/-1;grid-row:1;
  }
}
/* 平板横屏与矮屏：单页双栏操作，压缩非操作性边距，不截断按钮。 */
@media(min-width:640px) and (max-width:940px) and (max-height:540px){
  html:not([data-role="screen"]){
    --ctl-h:clamp(38px,9dvh,48px);--gap:4px;--group-gap:4px;

  html:not([data-role="screen"]) .split{

    grid-template-rows:minmax(0,1fr);
  }
  html:not([data-role="screen"]) .left>.stage{grid-area:1/1/2/2}
  html:not([data-role="screen"]) .split>.panel{grid-area:1/1/2/2}
  html:not([data-role="screen"]) .left>.dock,
  html:not([data-role="screen"])[data-ui="touch"] .left>.dock{
    grid-area:1/2/2/3;display:flex;flex-direction:column;
    justify-content:center;gap:4px;padding:5px;align-items:stretch;
  }
  html:not([data-role="screen"]) .dock>.grp-view{grid-template-columns:repeat(2,minmax(0,1fr))}
  html:not([data-role="screen"]) .dock>.grp-method{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:var(--ctl-h);
  }
  html:not([data-role="screen"]) .dock>.grp-method .cap{display:none}
  html:not([data-role="screen"]) .dock>.grp-method .b:nth-of-type(-n+3){grid-column:span 2}

<script>
(function(){
"use strict";
var T=window.THREE;

/* ================= 角色 =================
   同一个文件三种身份：
     大屏（网址 /screen）—— 只显示，不接受操作，跟着平板走
     平板（网址 /pad）  —— 操作台，状态一变就发给大屏
     单机              —— 双击打开就用，和桌面版一样（投屏到大屏时也是这个）
   直接打开文件时，触摸屏自动上平板界面；想强制指定就在网址后面加 #pad / #screen / #desk。 */
var ROLE=(function(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(h==="screen"||h==="pad"||h==="desk") return h;
  var p=(location.pathname||"").toLowerCase();
  if(p.indexOf("screen")>=0) return "screen";
  if(p.indexOf("pad")>=0)    return "pad";
  try{ if(window.matchMedia("(pointer:coarse)").matches) return "touch"; }catch(e){}
  return "desk";
})();
var TOUCHUI=(ROLE==="pad"||ROLE==="touch");
var NET=(ROLE==="pad"||ROLE==="screen") && /^https?:/.test(location.protocol);
document.documentElement.dataset.role=ROLE;
document.documentElement.dataset.ui=TOUCHUI?"touch":"desk";
// 仅阻止三维画布/滑杆的原生手势；正文仍允许浏览器辅助缩放。
["gesturestart","gesturechange"].forEach(function(type){
  document.addEventListener(type,function(e){
    if(e.target && e.target.closest && e.target.closest("#cv, .knob, .angle-widget")) e.preventDefault();
  },{passive:false});
});
document.addEventListener("dblclick",function(e){
  if(e.target && e.target.closest && e.target.closest("#cv, .knob, .angle-widget")) e.preventDefault();
},{passive:false});

// 销孔打在圆柱的三分之一处 —— 孔中心线偏离轴心 ECC，不过轴心。
// 拉杆转 θ，它的孔中心线绕轴走一段圆弧，与拨叉那个固定的孔中心线拉开
//   d = 2·ECC·|sin(θ/2)|
// θ=0 两孔同轴；θ=180° 孔跑到对面，相距 2·ECC，比销孔本身还大。
// 注意：这几个常量必须在建场景之前声明，下面的零件位置要用。
var ECC=2.7, TOL=0.30;
var WIN=2*Math.asin(Math.min(1,TOL/(2*ECC)))*180/Math.PI;   // 最大允许转角 ±WIN，约 ±6.4°

/* ================= geometry ================= */
function decode(o){
  var bin=atob(o.d), n=bin.length, u=new Uint8Array(n);
  for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  var q=new Int16Array(u.buffer), p=new Float32Array(q.length);
  for(var j=0;j<q.length;j++) p[j]=q[j]*o.s;
  var g=new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(p,3));
  g.computeVertexNormals();
  return g;
}

/* ================= scene ================= */
var cv=document.getElementById("cv");
var renderer=new T.WebGLRenderer({canvas:cv,antialias:true});
renderer.setClearColor(0x0c0e11,1);
var scene=new T.Scene();
var camera=new T.PerspectiveCamera(38,1,1,2000);
var amb=new T.AmbientLight(0xffffff,0.46); scene.add(amb);
var key=new T.DirectionalLight(0xfff0d8,0.95); key.position.set(90,120,150); scene.add(key);
var fill=new T.DirectionalLight(0xa8c0dd,0.24); fill.position.set(-120,-40,-90); scene.add(fill);
var rim=new T.DirectionalLight(0xe3a03c,0.5); rim.position.set(-40,90,-120); scene.add(rim);

var MAT={
  steel:new T.MeshStandardMaterial({color:0xa8b0b8,metalness:.72,roughness:.42}),
  fork :new T.MeshStandardMaterial({color:0x9ba2a9,metalness:.62,roughness:.52}),
  pin  :new T.MeshStandardMaterial({color:0xc9483f,metalness:.5,roughness:.45}),
  clip :new T.MeshStandardMaterial({color:0x6f8ea8,metalness:.75,roughness:.35}),
  wash :new T.MeshStandardMaterial({color:0x707880,metalness:.6,roughness:.55}),
  case_:new T.MeshStandardMaterial({color:0x2a3037,metalness:.25,roughness:.85,transparent:true,opacity:.28,side:T.DoubleSide})
};

var ASM=new T.Group(); ASM.rotation.x=-45*Math.PI/180; scene.add(ASM);
var fork=new T.Mesh(decode(GEO.fork), MAT.fork);
var pin =new T.Mesh(decode(GEO.pin),  MAT.pin);

// 拨叉拉杆 — revolved from the stepped profile in the assembly video (fork bore measures Ø16)
function lathe(pts,seg){
  var v=pts.map(function(q){return new T.Vector2(q[0],q[1])});
  var m=new T.Mesh(new T.LatheGeometry(v,seg||44),MAT.steel);
  m.rotation.z=-Math.PI/2; return m;
}
var TA=66, TB=132;
var rodPts=[[0,-168],[6.4,-166],[6.4,-154],[2.8,-153],[2.8,-147],[5.3,-146],
            [5.3,-42],[8,-37],[8,-18],[6.1,-17],[6.1,-14.5],[8,-13.5],
            [8,TA],[6.6,TA+1.5],[0,TA+1.5]];
var threadPts=[[0,TA]];
for(var tz=TA; tz<TB; tz+=1.5) threadPts.push([(tz%3)<1.5?6.7:5.5, tz]);
threadPts.push([5.2,TB],[0,TB]);
var rod=new T.Group(); rod.add(lathe(rodPts,48)); rod.add(lathe(threadPts,26));

var rodPivot=new T.Group(); rodPivot.add(rod);
var forkPivot=new T.Group(); forkPivot.add(fork);
var pinGroup=new T.Group(); pinGroup.add(pin);
ASM.add(rodPivot, forkPivot, pinGroup);

function washer(){
  var sh=new T.Shape(); sh.absarc(0,0,10.2,0,Math.PI*2,false);
  var h=new T.Path(); h.absarc(0,0,8.15,0,Math.PI*2,true); sh.holes.push(h);
  var m=new T.Mesh(new T.ExtrudeGeometry(sh,{depth:1.5,bevelEnabled:false,curveSegments:40}),MAT.wash);
  m.rotation.y=Math.PI/2; return m;
}
var washA=washer(), washB=washer();
washA.position.x=-13.6; washB.position.x=13.4; ASM.add(washA,washB);

var clip=new T.Group();
(function(){
  var r=new T.Mesh(new T.TorusGeometry(7.4,1.15,9,44,Math.PI*1.66),MAT.clip);
  r.rotation.y=Math.PI/2; clip.add(r);
  [0.17,1.83].forEach(function(k){
    var l=new T.Mesh(new T.SphereGeometry(1.7,12,10),MAT.clip);
    l.position.set(0, 7.4*Math.cos(k*Math.PI), 7.4*Math.sin(k*Math.PI)); clip.add(l);
  });
})();
clip.position.x=-15.8; ASM.add(clip);

var caseGrp=new T.Group();
(function(){
  var sh=new T.Shape();
  sh.moveTo(-70,-46); sh.lineTo(70,-46); sh.lineTo(70,46); sh.lineTo(-70,46); sh.lineTo(-70,-46);
  var h=new T.Path(); h.absarc(0,ECC,4,0,Math.PI*2,true); sh.holes.push(h);
  var w=new T.Mesh(new T.ExtrudeGeometry(sh,{depth:5,bevelEnabled:false}),MAT.case_);
  w.rotation.x=Math.PI/2; w.position.y=42; caseGrp.add(w);
})();
ASM.add(caseGrp);

// hole-axis indicators
function axisRod(color){
  var g=new T.Group();
  var m=new T.MeshBasicMaterial({color:color,transparent:true,opacity:.92,depthTest:false});
  g.add(new T.Mesh(new T.CylinderGeometry(.55,.55,42,14),m));
  [-17,17].forEach(function(yy){
    var r=new T.Mesh(new T.TorusGeometry(2.6,.55,8,28),m);
    r.rotation.x=Math.PI/2; r.position.y=yy; g.add(r);
  });
  g.renderOrder=10; g.traverse(function(o){o.renderOrder=10});
  return g;
}
var mRod=axisRod(0x62e0a0), mFork=axisRod(0xffcc55);
mRod.position.z=ECC; mFork.position.z=ECC;     // 偏心：两根孔轴线都离开轴心 ECC
rodPivot.add(mRod); forkPivot.add(mFork);
mRod.scale.set(.5,1,.5); mFork.scale.set(.5,1,.5);

// ---- 销孔通道 ----
// 销子依次穿过：拨叉上壁 → 拉杆上壁 → 拉杆下壁 → 拨叉下壁 —— 这就是「四孔」。
// 把每段孔画成一根半透明的通道管：对上了合成一条直通道，错开了就是两条岔开的管。
var HOLE_R=2.5;                                   // 销孔 Ø5
// 三段实心棒 = 四个孔的孔壁：拨叉上壁 / 拉杆（上下两壁之间）/ 拨叉下壁。
// 对上了三段连成一根直的；转歪了中间那段（绿色，属于拉杆）就甩出去，棒子断开。
function seg(color,len,y){
  var g=new T.Group();
  var m=new T.MeshBasicMaterial({color:color,depthTest:false});
  var c=new T.Mesh(new T.CylinderGeometry(HOLE_R,HOLE_R,len,24),m);
  c.position.y=y; c.name="tube"; g.add(c);
  [y-len/2,y+len/2].forEach(function(yy){
    var r=new T.Mesh(new T.TorusGeometry(HOLE_R+0.55,.5,8,30),
          new T.MeshBasicMaterial({color:color,depthTest:false}));
    r.rotation.x=Math.PI/2; r.position.y=yy; g.add(r);
  });
  g.position.z=ECC;
  g.renderOrder=20; g.traverse(function(o){o.renderOrder=20});
  return g;
}
var R_FORK=14.4, R_ROD=8.0;
var boreF1=seg(0xffcc55,R_FORK-R_ROD,(R_FORK+R_ROD)/2);    // 拨叉上壁的孔
var boreF2=seg(0xffcc55,R_FORK-R_ROD,-(R_FORK+R_ROD)/2);   // 拨叉下壁的孔
var boreRod=seg(0x62e0a0,2*R_ROD,0);                       // 拉杆上下两壁之间
forkPivot.add(boreF1,boreF2); rodPivot.add(boreRod);
var HOLES=[boreF1,boreF2,boreRod];
// 四个孔口的锚点，用来挂屏幕上的 ①②③④
function anchor(parent,y){var o=new T.Object3D();o.position.set(0,y,ECC);parent.add(o);return o;}
var yRod=Math.sqrt(R_ROD*R_ROD-ECC*ECC);
var ANCH=[anchor(forkPivot,R_FORK), anchor(rodPivot,yRod),
          anchor(rodPivot,-yRod),   anchor(forkPivot,-R_FORK)];
var LBL=null;
// 从 Ø8 观察孔往里看时用的三个定位点：拨叉孔中心 / 孔壁边缘（量半径用）/ 拉杆孔转过去的位置
var holeAnchor=new T.Object3D(); holeAnchor.position.set(0,0,ECC); ASM.add(holeAnchor);
var edgeAnchor=new T.Object3D(); edgeAnchor.position.set(HOLE_R,0,ECC); ASM.add(edgeAnchor);
var rodHole2D =new T.Object3D(); rodHole2D.position.set(0,0,ECC);  ASM.add(rodHole2D);
// 画出拉杆轴心，让「偏心」看得见
var axisLine=new T.Mesh(new T.CylinderGeometry(.22,.22,150,8),
  new T.MeshBasicMaterial({color:0x6b7580,transparent:true,opacity:.75,depthTest:false}));
axisLine.rotation.z=Math.PI/2; axisLine.renderOrder=9; ASM.add(axisLine);

// collar marking the pin end that faces the hole
var lead=new T.Mesh(new T.TorusGeometry(4.3,.62,9,30),
        new T.MeshBasicMaterial({color:0x62e0a0,depthTest:false}));

/* ================= state ================= */
var S={angle:34, pinRev:false, pinDepth:0, blind:false, peeked:false, xray:true, marks:true, probe:"idle",
       aid:"none", jammed:false, step:0};
var pinU=0;
function misTotal(){ return 2*ECC*Math.abs(Math.sin(S.angle*Math.PI/360)); }
function blindfold(){ return S.blind && !S.peeked; }

function apply(){
  rodPivot.rotation.x = S.angle*Math.PI/180;
  if(S.step!==0){
    pinGroup.position.y = 38 - 38*S.pinDepth;
  }
  pinGroup.position.z = ECC;                  // 销子走偏心那条线
  axisLine.visible=false;
  // 盖上以后销子在盖板外面，正对着视线——没开始插就不画它
  pinGroup.visible = (!S.blind || S.probe!=="idle");
  var showHoles = (S.step===0 && !S.blind);
  var thru0=(S.step===0 && S.probe==="in");
  // 销子穿过去以后把孔道管子收起来，只留四个孔口圈 —— 红销子一根通到底，看得干净
  HOLES.forEach(function(h){
    h.visible=showHoles;
    h.traverse(function(o){ if(o.name==="tube") o.visible=!thru0; });
  });
  var xr = showHoles && S.xray;
  [MAT.fork,MAT.steel].forEach(function(m){
    m.transparent=xr; m.opacity=xr?0.42:1; m.depthWrite=!xr; m.needsUpdate=true;
  });
  MAT.wash.transparent=MAT.clip.transparent=xr;
  MAT.wash.opacity=MAT.clip.opacity=xr?0.42:1;
  MAT.wash.depthWrite=MAT.clip.depthWrite=!xr;
  caseGrp.visible = S.blind;
  // 盖上＝箱子里是暗的，只剩观察孔那一点光
  MAT.case_.opacity = S.blind?0.94:0.28;
  amb.intensity  = S.blind?0.085:0.46;
  key.intensity  = S.blind?0.10:0.95;
  fill.intensity = S.blind?0.075:0.24;
  rim.intensity  = S.blind?0.02:0.50;
  updHint();
  mRod.visible = mFork.visible = false;
  syncPush();
  MAT.pin.color.setHex((S.jammed||S.probe==="block")?0xff5a4d:0xc9483f);
  var thru=(S.step===0 && S.probe==="in");
  if(MAT.pin.depthTest===thru){ MAT.pin.depthTest=!thru; MAT.pin.needsUpdate=true; }
  pin.renderOrder = thru?22:0;
  lead.renderOrder = thru?23:12;
  hud();
}

/* ================= camera ================= */
var cam={az:-0.62,el:0.34,dist:250};
var camTgt=new T.Vector3(0,0,0), camLock=false, camSave=null;
function place(){
  camera.position.set(camTgt.x+cam.dist*Math.cos(cam.el)*Math.sin(cam.az),
                      camTgt.y+cam.dist*Math.sin(cam.el),
                      camTgt.z+cam.dist*Math.cos(cam.el)*Math.cos(cam.az));
  camera.lookAt(camTgt);
  syncPush();
}
// ---- 盖上盖板＝只剩一条视线：从 Ø8 观察孔沿着销孔轴线看进去 ----
// 总成整体绕 X 转了 -45°，所以销孔轴线在世界坐标里指着 (0,√2/2,-√2/2)，
// 折成球坐标就是 az=-π、el=π/4。镜头距离按画面高度算，让 Ø8 孔正好撑满那个圆窗。
function portR(){                                  // 圆窗半径：平板、大屏上这个窗是放大的
  var p=document.querySelector(".blind .port");
  if(p){ var w=p.getBoundingClientRect().width; if(w>10) return w/2; }
  return 42;
}
function holeDist(){
  var h=Math.max(200,cv.parentElement.getBoundingClientRect().height);
  var f=(h/2)/Math.tan(38*Math.PI/360);
  return 42 + 4*f/portR();                         // 42＝盖板到销孔中心的高度，4＝Ø8 的半径
}
function lockHoleView(on){
  if(on){
    if(!camLock){ camSave={az:cam.az,el:cam.el,dist:cam.dist}; camLock=true; }
    ASM.updateMatrixWorld(true); holeAnchor.getWorldPosition(camTgt);
    cam.az=-Math.PI; cam.el=Math.PI/4; cam.dist=holeDist();
  }else{
    if(camLock&&camSave){ cam.az=camSave.az; cam.el=camSave.el; cam.dist=camSave.dist; }
    camLock=false; camSave=null; camTgt.set(0,0,0);
  }
  cv.style.cursor = on?"default":"";
  place();
}
// 单指拖＝转视角，双指捏＝缩放（平板上没有滚轮）
var ptrs=Object.create(null), drag=null, pinch=null;
function ptrList(){ var a=[],k; for(k in ptrs) a.push(ptrs[k]); return a; }
function gap(l){ return Math.hypot(l[0].x-l[1].x, l[0].y-l[1].y); }
cv.addEventListener("pointerdown",function(e){
  if(camLock||ROLE==="screen")return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  var l=ptrList();
  if(l.length===1){ drag={x:e.clientX,y:e.clientY}; pinch=null; }
  else if(l.length>=2){ drag=null; pinch={g:Math.max(8,gap(l)), d:cam.dist}; }
});
cv.addEventListener("pointermove",function(e){
  if(!(e.pointerId in ptrs)) return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var l=ptrList();
  if(pinch&&l.length>=2){
    cam.dist=Math.max(55,Math.min(460, pinch.d*pinch.g/Math.max(8,gap(l))));
    place(); return;
  }
  if(!drag)return;
  cam.az-=(e.clientX-drag.x)*0.008;
  cam.el=Math.max(-1.35,Math.min(1.35,cam.el+(e.clientY-drag.y)*0.008));
  drag={x:e.clientX,y:e.clientY}; place();
});
["pointerup","pointercancel"].forEach(function(t){cv.addEventListener(t,function(e){
  delete ptrs[e.pointerId];
  var l=ptrList();
  if(l.length<2) pinch=null;
  drag = (l.length===1) ? {x:l[0].x,y:l[0].y} : null;
})});
cv.addEventListener("wheel",function(e){e.preventDefault(); if(camLock||ROLE==="screen")return;
  cam.dist=Math.max(55,Math.min(460,cam.dist*(1+Math.sign(e.deltaY)*0.12)));place()},{passive:false});
function resize(){
  var r=cv.parentElement.getBoundingClientRect();
  // 容器被浏览器折叠时不建立无意义的 200×200 离屏缓冲。
  if(r.width<1 || r.height<1) return;
  var w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
  // 手机和平板限制渲染像素比，减少高 DPR 屏的显存/功耗。
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,TOUCHUI?1.75:2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(camLock){ cam.dist=holeDist(); place(); }
  if(hudEl) hud();
}
if(typeof ResizeObserver!=="undefined") new ResizeObserver(resize).observe(cv.parentElement);
window.addEventListener("resize",resize,{passive:true});
window.addEventListener("orientationchange",function(){requestAnimationFrame(resize);},{passive:true});
if(window.visualViewport) window.visualViewport.addEventListener("resize",resize,{passive:true});
window.addEventListener("appviewportchange",function(){
  requestAnimationFrame(function(){updateTopHeight();resize();});
});

/* ================= HUD & verdict ================= */
var hudEl=document.getElementById("hud"), vdEl=document.getElementById("vd");
function hud(){
  var m=misTotal(), hid=blindfold();
  var bl=document.getElementById("blind");
  bl.classList.toggle("on",S.blind);
  var beadOn=S.blind&&S.aid==="bead";
  bl.classList.toggle("bead",beadOn);
  bl.classList.toggle("lit", beadOn&&m<=TOL);
  bl.classList.toggle("glow",beadOn&&m>TOL&&m<2*HOLE_R);
  updBeam(beadOn,m);
  var wl=document.getElementById("wl");
  wl.classList.toggle("on",S.blind&&S.aid==="line");
  // 剖面示意：偏心量放大画，5.4 mm 的错位在三维里看不出来，在这儿一目了然
  var showX = (S.step===0 && !blindfold());
  document.getElementById("xsec").classList.toggle("on",showX);
  document.getElementById("xseccap").classList.toggle("on",showX);
  if(showX){
    // 沿销孔看进去：拨叉的孔（黄圈）套着拉杆的孔（绿圈），错开多少一眼看见
    var SC2=12.5/HOLE_R, off=Math.min(m*SC2,30);
    document.getElementById("ovl").setAttribute("cy",(-off).toFixed(2));
    document.getElementById("rodC").setAttribute("cy",(-off).toFixed(2));
    var xl2=document.getElementById("xlab2");
    xl2.textContent = m<=TOL ? "通 · 销子过得去" : "堵 · 错开 "+m.toFixed(2)+" mm";
    xl2.setAttribute("fill", m<=TOL?"#62e0a0":"#e0837c");
  }
  document.getElementById("wlmark").setAttribute("transform","rotate("+(S.angle+2.1)+")");

  var cls=m<=TOL?"ok":(m<1.2?"warn":"bad");
  var st, stc;
  if(S.jammed){ st="销子卡死"; stc="bad"; }
  else if(S.pinDepth>=1){ st="销子到位"; stc="ok"; }
  else if(hid){
    if(S.probe==="run"){ st="销子往下插"; stc="warn"; }
    else if(S.probe==="in"){ st="销子过去了"; stc="ok"; }
    else if(S.probe==="block"){ st="顶住了"; stc="bad"; }
    else if(S.aid==="bead"){
      if(m<=TOL){ st="光成整圆"; stc="ok"; }
      else if(m<2*HOLE_R){ st="只有月牙光"; stc="warn"; }
      else { st="不透光"; stc="bad"; }
    }
    else { st="看不见"; stc="warn"; }
  }
  else if(S.pinRev){ st="销子装反了"; stc="bad"; }
  else { st=m<=TOL?"可以打销":"未对位"; stc=cls; }

  var rows='<div class="row"><span class="lab">对位偏差</span><span class="val '+(hid?"s warn":cls)+'">'+
             (hid?"已遮挡":m.toFixed(2))+'</span>'+(hid?'':'<span class="lab">mm</span>')+'</div>'+
           '<div class="row"><span class="lab">拉杆转角</span><span class="val">'+
             S.angle.toFixed(1)+'</span><span class="lab">°</span></div>';
  if(S.step===0&&!hid) rows+='<div class="row"><span class="lab">合格窗口</span><span class="val s">±'+WIN.toFixed(1)+'°</span></div>';
  if(S.step>=1) rows+='<div class="row"><span class="lab">销　　向</span><span class="val s '+(S.pinRev?"bad":"ok")+'">'+
             (S.pinRev?"平头朝下":"导向端朝下")+'</span></div>';
  rows+='<div class="row"><span class="lab">状　　态</span><span class="val s '+stc+'">'+st+'</span></div>';
  hudEl.innerHTML=rows;
}
/* ---- 孔里那点光 ----
   工装灯珠在箱底，光要一路穿过拨叉的孔和拉杆的孔才到得了眼睛。
   两个 Ø5 的孔错开 m，看见的就是两圆相交的那一块：错开一整个孔＝全黑，
   慢慢转近＝一弯月牙越长越肥，完全同轴＝一个整圆，中间还烧出一个白核。 */
var _bp=new T.Vector3();
function projPx(o,w,h){
  o.getWorldPosition(_bp); _bp.project(camera);
  return {x:(_bp.x*0.5+0.5)*w, y:(-_bp.y*0.5+0.5)*h};
}
function sa(id,k,v){ var e=document.getElementById(id); if(e) e.setAttribute(k,v); }
function updBeam(on,m){
  var sv=document.getElementById("beam"); if(!sv) return;
  var show = on && S.probe==="idle";                 // 销子一往里插就挡住光了
  sv.classList.toggle("on",show);
  if(!show) return;
  var r=cv.getBoundingClientRect(), w=Math.max(1,r.width), h=Math.max(1,r.height);
  sv.setAttribute("viewBox","0 0 "+w+" "+h);
  var th=S.angle*Math.PI/180;
  rodHole2D.position.set(ECC*Math.sin(th),0,ECC*Math.cos(th));   // 拉杆的孔转到哪儿了
  ASM.updateMatrixWorld(true);
  var pF=projPx(holeAnchor,w,h), pR=projPx(rodHole2D,w,h), pE=projPx(edgeAnchor,w,h);
  var rad=Math.max(2,Math.hypot(pE.x-pF.x,pE.y-pF.y));
  var t=Math.max(0,1-m/(2*HOLE_R));                  // 两孔重叠多少
  var core=(m<=TOL)?1:Math.max(0,1-(m-TOL)/0.20);    // 白热核＝真同轴才看得见灯珠本身
  var mx=(pF.x+pR.x)/2, my=(pF.y+pR.y)/2;
  sa("lensA","cx",pR.x.toFixed(1)); sa("lensA","cy",pR.y.toFixed(1)); sa("lensA","r",rad.toFixed(1));
  ["lensR","lensC"].forEach(function(id){
    sa(id,"cx",pF.x.toFixed(1)); sa(id,"cy",pF.y.toFixed(1)); sa(id,"r",rad.toFixed(1));
  });
  sa("gRed","cx",mx.toFixed(1));  sa("gRed","cy",my.toFixed(1));  sa("gRed","r",(rad*1.05).toFixed(1));
  sa("gCore","cx",mx.toFixed(1)); sa("gCore","cy",my.toFixed(1)); sa("gCore","r",(rad*0.95).toFixed(1));
  sa("lensC","opacity",core.toFixed(3));
  sa("lensG","opacity",Math.pow(t,0.55).toFixed(3));
  sa("gBore","cx",pF.x.toFixed(1)); sa("gBore","cy",pF.y.toFixed(1)); sa("gBore","r",(rad*1.12).toFixed(1));
  sa("boreDim","cx",pF.x.toFixed(1)); sa("boreDim","cy",pF.y.toFixed(1)); sa("boreDim","r",(rad*1.02).toFixed(1));
  sa("boreDim","opacity",(0.20+0.26*t).toFixed(3));
}
function updHint(){
  var e=document.getElementById("hint"); if(!e) return;
  e.textContent = S.blind
    ? (TOUCHUI ? "视角已锁死在 Ø8 观察孔 · 只能转拉杆"
               : "视角已锁死在 Ø8 观察孔 · 只能转拉杆 · ← → = 微调 · 空格 = 敲击")
    : (TOUCHUI ? "单指拖 = 转视角 · 双指捏 = 缩放 · 左右滑动 = 转拉杆"
               : "拖动 = 转视角 · 滚轮 = 缩放 · ← → = 微调转角 · 空格 = 敲击");
}
function verdict(kind,big,small){
  if(!kind){ vdEl.className="verdict"; vdEl.innerHTML=""; return; }
  vdEl.className="verdict show "+kind;
  vdEl.innerHTML='<span class="big">'+big+'</span>'+(small?'<span class="sm">'+small+'</span>':'');
}

var _v=new T.Vector3();
function placeLabels(show){
  if(!LBL) LBL=[1,2,3,4].map(function(i){return document.getElementById("hl"+i)});
  var r=cv.getBoundingClientRect();
  for(var i=0;i<4;i++){
    LBL[i].classList.toggle("on",show);
    if(!show) continue;
    ANCH[i].getWorldPosition(_v); _v.project(camera);
    LBL[i].style.left=((_v.x*0.5+0.5)*r.width)+"px";

/* 第一屏：销子悬在孔口上方，点「试着插进去」就往下走。
   对上了一插到底；没对上，销尖顶在拉杆外圆上就停住。 */
function probeTarget(){
  var PIN_H=12.83, yBlock=Math.sqrt(R_ROD*R_ROD-ECC*ECC)+PIN_H;
  return S.probe==="idle" ? 46 : (misTotal()<=TOL ? -4 : yBlock);   // -4：导向端刚好穿出第④孔
}
var _pt=0;
function animPin(now){
  var dt=_pt? Math.min(0.10,(now-_pt)/1000) : 0; _pt=now;
  if(S.step!==0) return;
  var tgt=probeTarget(), y=pinGroup.position.y, d=tgt-y;
  var stepmm=(S.probe==="idle"?110:58)*dt;          // 插进去慢一点，拔出来快一点
  if(Math.abs(d)<=stepmm){
    pinGroup.position.y=tgt;
    if(S.probe==="run"){ S.probe = misTotal()<=TOL ? "in" : "block"; apply(); refresh(); }
  }else{
    pinGroup.position.y = y + (d>0?stepmm:-stepmm);
  }
}
(function loop(now){
  requestAnimationFrame(loop);
  animPin(now||performance.now());
  placeLabels(S.step===0 && !S.blind && S.marks);
  var t=S.pinRev?1:0;
  if(Math.abs(pinU-t)>0.002) pinU+=(t-pinU)*0.13; else pinU=t;
  pin.rotation.z=Math.PI*pinU;
  lead.material.color.setHex(pinU<0.5?0x62e0a0:0xd94a3e);
  renderer.render(scene,camera);
})();

/* ---- 原始旋钮绘制工具（历史保留，操作界面已替换为水平滑杆） ----
   上面那根长拉杆怎么转，这个盘就怎么转：按住绕圈拖，滚轮微调。
   盘上那个绿点是拉杆自己的偏心销孔，外面那个黄圈是拨叉那个不动的孔——
   两个点套在一起，四孔就成一条直线了。顶上那截绿弧就是 ±WIN 的合格窗口。 */
function polar(r,a){ var t=a*Math.PI/180; return [ (r*Math.sin(t)).toFixed(2), (-r*Math.cos(t)).toFixed(2) ]; }
function arcPath(r,a0,a1){
  var p0=polar(r,a0), p1=polar(r,a1);
  return "M"+p0[0]+","+p0[1]+"A"+r+","+r+" 0 0 1 "+p1[0]+","+p1[1];
}

/* 两个步骤共用水平滑杆。盖板、白线和灯珠模式只改变观察方式，
   不锁定操作控件；滑块位置、角度读数和三维拉杆使用同一个 S.angle。 */
function slider(){
  return '<div class="grp wide grp-turn"><span class="cap">拉杆转角</span>'+
    '<div class="angle-widget" id="knob" tabindex="0" '+
      'role="slider" aria-label="左右滑动拉杆转角" aria-orientation="horizontal" '+
      'aria-valuemin="-180" aria-valuemax="180" aria-valuenow="'+S.angle.toFixed(1)+'" '+
      'aria-valuetext="当前 '+S.angle.toFixed(1)+' 度" '+
      'title="左右拖动或点击滑轨调整角度；方向键或两侧按钮微调；按住 Shift 更精细">'+
      '<div class="angle-track" id="angleTrack">'+
        '<div class="angle-center"></div><div class="angle-progress" id="angleProgress"></div>'+
        '<div class="angle-thumb" id="angleThumb"></div></div>'+
      '<div class="angle-scale" aria-hidden="true"><span>−180°</span><span class="angle-zero">0°</span><span>+180°</span></div></div>'+
    '<div class="knobrd"><span class="rd" id="av">'+S.angle.toFixed(1)+'°</span>'+
      '<div class="nudge"><button class="b sm" data-act="nl" aria-label="拉杆向左微调 0.5 度">◀</button>'+
      '<button class="b sm" data-act="nr" aria-label="拉杆向右微调 0.5 度">▶</button>'+
      '<span class="ktip">左右滑动拉杆</span></div></div></div>';
}
function updKnob(){
  var k=document.getElementById('knob'); if(!k) return;
  var thumb=document.getElementById('angleThumb');
  var bar=document.getElementById('angleProgress'), pct=(S.angle+180)/360*100;
  k.setAttribute('aria-valuenow',S.angle.toFixed(1));
  k.setAttribute('aria-valuetext','当前 '+S.angle.toFixed(1)+' 度');
  if(thumb) thumb.style.left=pct+'%';
  if(bar){bar.style.left=Math.min(50,pct)+'%';bar.style.width=Math.abs(pct-50)+'%';}
  var av=document.getElementById('av');
  if(av) av.textContent=S.angle.toFixed(1)+'°';
}
function initKnob(){
  var k=document.getElementById('knob'), track=document.getElementById('angleTrack');
  if(!k||!track||ROLE==='screen') return;
  var pid=null, grabOffset=0;
  function geom(){
    var r=track.getBoundingClientRect();
    // 与 CSS 的 left 百分比使用同一段轨道，避免手指位置与滑块错位。
    return {left:r.left+track.clientLeft,width:Math.max(1,track.clientWidth)};
  }
  function at(x,g){
    return Math.max(-180,Math.min(180,(x-g.left)/g.width*360-180));
  }
  k.addEventListener('pointerdown',function(e){
    if(pid!==null || (e.pointerType==='mouse' && e.button!==0)) return;
    e.preventDefault();e.stopPropagation();
    pid=e.pointerId;
    k.focus({preventScroll:true});
    var g=geom(), thumbX=g.left+((S.angle+180)/360)*g.width;
    var thumb=document.getElementById('angleThumb');
    var hitRadius=Math.max(16,thumb?thumb.getBoundingClientRect().width/2:16);
    var onThumb=Math.abs(e.clientX-thumbX)<=hitRadius;
    grabOffset=onThumb?e.clientX-thumbX:0;
    // 按住滑块时保持原位置；点击轨道时跳到点击处。所有模式行为一致。
    if(!onThumb) setAng(at(e.clientX,g));
    try{k.setPointerCapture(e.pointerId);}catch(err){}
  });
  k.addEventListener('pointermove',function(e){
    if(pid!==e.pointerId) return;
    e.preventDefault();
    setAng(at(e.clientX-grabOffset,geom()));
  });
  function release(e){
    if(pid!==e.pointerId) return;
    pid=null;
    try{if(k.hasPointerCapture(e.pointerId)) k.releasePointerCapture(e.pointerId);}catch(err){}
  }
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){k.addEventListener(t,release);});
  k.addEventListener('wheel',function(e){
    if(!e.deltaY) return;
    e.preventDefault();setAng(S.angle+(e.deltaY>0?-1:1)*(e.shiftKey?0.1:0.5));
  },{passive:false});
  k.addEventListener('keydown',function(e){
    var d=e.shiftKey?0.1:0.5;
    if(e.key==='ArrowLeft'||e.key==='ArrowDown') setAng(S.angle-d);
    else if(e.key==='ArrowRight'||e.key==='ArrowUp') setAng(S.angle+d);
    else if(e.key==='Home') setAng(-180);
    else if(e.key==='End') setAng(180);
    else return;
    e.preventDefault();e.stopPropagation();
  });
}

ACT.open=function(){S.blind=false;S.peeked=false;S.probe="idle";lockHoleView(false);dockAlign();apply();refresh();};
ACT.close=function(){S.blind=true;S.peeked=false;S.probe="idle";lockHoleView(true);dockAlign();apply();refresh();};
ACT.probe=function(){S.probe=(S.probe==="idle"?"run":"idle"); dockAlign(); apply(); refresh();};
ACT.marks=function(){S.marks=!S.marks;dockAlign();apply();refresh();};
ACT.xrayOn=function(){S.xray=true;dockAlign();apply();refresh();};
ACT.xrayOff=function(){S.xray=false;dockAlign();apply();refresh();};
ACT.aN=function(){S.aid="none";dockAlign();apply();refresh();};
ACT.aL=function(){S.aid="line";dockAlign();apply();refresh();};
ACT.aB=function(){S.aid="bead";dockAlign();apply();refresh();};
ACT.shuffle=function(){var a;do{a=Math.round((Math.random()*340-170)*10)/10;}while(Math.abs(a)<25);setAng(a);};

/* ---- shared ---- */
ACT.nl=function(){setAng(S.angle-0.5)}; ACT.nr=function(){setAng(S.angle+0.5)};
function setAng(v){
  v=Number(v);
  if(!Number.isFinite(v)) return;
  // 水平滑杆在两端停止，-180° 不再被归一化成 +180° 而突然跳到另一端。
  S.angle=Math.round(Math.max(-180,Math.min(180,v))*10)/10;
  if(S.step===0){
    S.probe="idle";
    var probeButton=DOCK.querySelector('[data-act="probe"]');
    if(probeButton) probeButton.textContent="试着插进去";
  }
  updKnob();
  S.pinDepth=0; S.jammed=false; apply(); refresh();
}
ACT.hit=function(){};   // press-and-hold is wired separately
ACT.rst=function(){S.pinDepth=0;S.jammed=false;apply();refresh();};

var hammerTimer=null, hammerLast=0;
function startHit(e){
  if(e&&e.preventDefault)e.preventDefault(); if(hammerTimer)return;
  hammerLast=performance.now();
  hammerTimer=setInterval(function(){
    var now=performance.now(), dt=Math.min(0.25,(now-hammerLast)/1000); hammerLast=now;
    if(S.pinRev && S.pinDepth>=0.30){ S.jammed=true; stopHit(); apply(); refresh(); return; }
    if(misTotal()>TOL && S.pinDepth>=0.42){ S.jammed=true; stopHit(); apply(); refresh(); return; }
    S.pinDepth=Math.min(1,S.pinDepth+dt*0.55);
    if(S.pinDepth>=1) stopHit();
    apply(); refresh();
  },50);
}
function stopHit(){ if(hammerTimer){clearInterval(hammerTimer);hammerTimer=null;} }
window.addEventListener("pointerup",stopHit);
window.addEventListener("pointercancel",stopHit);
window.addEventListener("blur",stopHit);
document.addEventListener("visibilitychange",function(){if(document.hidden) stopHit();});

/* ================= verdict text ================= */
function refresh(){
  var m=misTotal();
  if(S.jammed && S.pinRev)
    return verdict("bad","顶在孔口，进不去",
      "Ø6 的平头直接怼在 Ø5 的孔口上，没有任何导入量。硬敲：销子端面镦粗、孔口拉伤，再歪一点就卡死在孔里。");
  if(S.jammed)
    return verdict("bad","销子卡死了",
      "过盈配合，进去一点就退不出来。冲击钻取销 1 小时；残件掉进箱底，油污里盲摸 3 小时。");
  if(S.pinDepth>=1)
    return verdict("ok","第二重保险到位","卡簧管窜动，销子管转动，双保险这才完整。");

  if(S.step===0){
    if(S.probe==="in")
      return verdict("ok","销子过去了", blindfold()
        ? "什么都没看见，销子自己过去了。判据就这一个。"
        : "四个孔排成了一条直的，销子一捅到底。这就是「对上了」——没有别的判据。");
    if(S.probe==="block")
      return verdict("bad","顶住了，进不去", blindfold()
        ? "销尖顶在实心料上。看不见差多少，只知道进不去。"
        : "销子穿过拨叉上壁那个孔，正对着的是拉杆的实心料。差 "+m.toFixed(2)+" mm，就一步也进不去。");
    if(S.probe==="run")
      return verdict("info","往下插……","看它是过去，还是顶住。");
    if(!S.blind){
      if(m<=TOL) return verdict("ok","四孔同轴，销子过得去","黄绿两段孔道接成了一条直的。记住这个位置——盖板一盖，你要在看不见的情况下，再找到它一次。");
      if(Math.abs(Math.abs(S.angle)-180)<3)
        return verdict("bad","反过来装：拉杆的两个孔跑到轴心另一边了",
          "两个孔错开 "+m.toFixed(2)+" mm，比销孔本身（Ø5）还大——整整错开一个孔。销子穿过拨叉的孔以后，正对着的是拉杆的实心料，连孔口都碰不着。");
      return verdict("info","还差 "+m.toFixed(2)+" mm",
        "黄绿两段孔道要接成一条直的。不确定就点「试着插进去」——过得去还是顶住，销子自己会告诉你。");
    }
    if(S.peeked)
      return verdict(m<=TOL?"ok":"bad","掀开一看：偏差 "+m.toFixed(2)+" mm",
        m<=TOL?"运气不错。但现场没有掀开这一步。":"差这么多。而刚才你心里觉得差不多了。");
    if(S.aid==="none")
      return verdict("info","看不见，只能凭手感","盖板遮挡了箱内销孔。左右拖动滑杆转动拉杆，再试插确认；操作区角度用于演示观察。");
    if(S.aid==="line")
      return verdict("info","白线带不进那 ±"+WIN.toFixed(1)+" 度","画线本身有误差，敲击震动还会再偏一点。白线解决方向，解决不了同轴。");
    if(m<=TOL) return verdict("ok","光成了整圆","五孔连成一条直的，光一路透到眼睛里。不用猜、不用摸——现在可以敲。");
    if(m<2*HOLE_R) return verdict("info","只透出一弯月牙","两个孔才搭上一点边，光就只漏出这么一条。继续转，把月牙收成一个整圆。");
    return verdict("bad","孔里不透光","两个孔完全错开，中间全是实心料。灯亮着，光一点也过不来。");
  }
  var okPin=!S.pinRev, okAim=m<=TOL;
  var line="销向 "+(okPin?"✓ 导向端朝下":"✗ 平头朝下")+"　／　对位偏差 "+m.toFixed(2)+" mm "+(okAim?"✓":"✗");
  if(okPin&&okAim)  return verdict("info","两个条件都满足了，可以敲",line);
  if(!okPin&&!okAim)return verdict("bad","两个条件都不满足",line);
  if(!okPin)        return verdict("bad","销子装反了：平头是足尺寸的 Ø6，孔口不收它",line);
  return verdict("bad","销孔没对上：过盈配合，斜一点就卡死在孔里",line);
}

/* ================= 双屏联动 =================
   平板是主、大屏是从。平板每次状态一动，就把整包状态 POST 给中转程序，
   中转原样转发，大屏收到照着摆一遍。两边跑的是同一份代码，所以不会走样。
   没有中转（双击打开文件，或者投屏用）时，下面这些全是空转。 */
var SY={on:false, busy:false, last:0, timer:null, peer:0, live:false};
function syncSnapshot(){
  return {t:"state", step:S.step, angle:S.angle, blind:S.blind, peeked:S.peeked,
    xray:S.xray, marks:S.marks, probe:S.probe, aid:S.aid, pinRev:S.pinRev,
    pinDepth:S.pinDepth, jammed:S.jammed,
    cam:[cam.az,cam.el,cam.dist], tgt:[camTgt.x,camTgt.y,camTgt.z], lock:camLock};
}
function syncSend(){
  SY.timer=null; SY.last=Date.now();
  try{
    fetch("/s",{method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify(syncSnapshot())})
      .then(function(r){ netMark(!!r.ok); },function(){ netMark(false); });
  }catch(e){ netMark(false); }
}
function syncPush(){
  if(typeof SY==="undefined"||!SY||!SY.on||ROLE!=="pad"||SY.busy||SY.timer) return;
  SY.timer=setTimeout(syncSend, Math.max(0, 45-(Date.now()-SY.last)));
}
function applyRemote(d){
  SY.busy=true;
  var stepChanged=(d.step!==S.step);
  S.step=d.step; S.angle=d.angle; S.blind=d.blind; S.peeked=d.peeked; S.xray=d.xray;
  S.marks=d.marks; S.probe=d.probe; S.aid=d.aid; S.pinRev=d.pinRev;
  S.pinDepth=d.pinDepth; S.jammed=d.jammed;
  cam.az=d.cam[0]; cam.el=d.cam[1]; cam.dist=d.cam[2];
  camTgt.set(d.tgt[0],d.tgt[1],d.tgt[2]); camLock=!!d.lock;
  if(camLock) cam.dist=holeDist();     // 圆窗在大屏上更大，镜头得按自己的画面重算
  if(stepChanged){
    [].forEach.call(NAV.children,function(b,k){b.setAttribute("aria-current",k===S.step)});
    STEPS[S.step].panel();
  }
  place(); apply(); refresh(); updKnob();
  SY.busy=false;
}
function netMark(ok){ SY.live=!!ok; netPaint(); }
function netPaint(){
  var c=document.getElementById("netchip"), w=document.getElementById("waitscr");
  if(!c) return;
  if(!SY.on){ c.hidden=true; if(w) w.classList.remove("on"); return; }
  c.hidden=false;
  var paired=SY.peer>0;
  c.className="netchip "+(paired?"ok":"no");
  c.textContent = (ROLE==="pad")
    ? (paired?"● 大屏已连接":"○ 大屏未连接")
    : (paired?"● 平板已连接":"○ 等待平板");
  if(w) w.classList.toggle("on", ROLE==="screen" && !paired);
}
function syncStart(){
  if(!NET){ netPaint(); return; }
  SY.on=true; netPaint();
  try{
    var es=new EventSource("/e?role="+ROLE);
    es.onmessage=function(ev){
      var d; try{ d=JSON.parse(ev.data); }catch(err){ return; }
      if(d.t==="peers"){ SY.peer=(ROLE==="pad"?d.screen:d.pad); netPaint(); return; }
      if(d.t==="state" && ROLE==="screen") applyRemote(d);
    };
    es.onopen =function(){ netMark(true); if(ROLE==="pad") syncSend(); };
    es.onerror=function(){ netMark(false); };
  }catch(e){ netMark(false); }
  fetch("/info").then(function(r){return r.json()}).then(function(j){
    var u=document.getElementById("wurl"); if(u&&j&&j.padUrl) u.textContent=j.padUrl;
  }).catch(function(){});
  if(ROLE==="pad") setTimeout(syncSend,400);
}

  card('<div class="eyebrow">第 2 步 · 销向与打销</div><h2>落锤之前，两件事都得对</h2>'+

   '<p>缺哪一个都是事故，而且<b>两种事故长得不一样</b>。把两个开关都拨一遍，四种组合都敲一次。</p>')+
  card('<h3>销子有头有尾</h3>'+
   '<p>弹性圆柱销一端收成<b>圆弧导向端</b>，比销身小一圈、略小于销孔，负责把销子引进孔口；另一端是<b>平头</b>，足尺寸，没有导向。</p>'+
   '<p>销子下端那圈标记：<b style="color:#62e0a0">绿色＝导向端在下</b>，<b style="color:#e0837c">红色＝平头在下</b>。</p>'+
   '<p>装反了硬敲：<b>顶在孔口进不去</b>，销子端面镦粗、孔口拉伤。而在箱体里面，你看不见销子哪一头朝下——只能在装进去之前用手摸清楚。</p>','hot')+
  card('<h3>对位没到 0.30 呢</h3>'+
   '<p>销子能进去一截，然后<b>斜着卡死在孔里</b>。过盈配合，退不出来：冲击钻取销 1 小时，残件掉进箱底，油污里盲摸 3 小时。</p>')+
  card('<h3>两条红线</h3>'+
   '<p><b>顺序不可逆</b>　先卡簧、后销子。销子一到位，拉杆锁死，卡簧再也送不进卡槽，整套拆解返工。</p>'+
   '<p><b>销向不可反</b>　圆弧导向端必须朝着销孔。</p>','hot');
}

/* ================= modes & keys ================= */
// 吸附三维画面时实时计算顶部导航的实际高度：旋转和系统字体放大均适用。
var topEl=document.querySelector(".top");
function updateTopHeight(){
  if(topEl) document.documentElement.style.setProperty("--top-height",
    Math.ceil(topEl.getBoundingClientRect().height)+"px");
}
if(typeof ResizeObserver!=="undefined" && topEl)
  new ResizeObserver(updateTopHeight).observe(topEl);
window.addEventListener("resize",updateTopHeight,{passive:true});
updateTopHeight();
function setMode(m){
  document.documentElement.dataset.mode=m;
  document.getElementById("mStage").setAttribute("aria-pressed", m==="stage");
  document.getElementById("mFull").setAttribute("aria-pressed", m!=="stage");
  try{ localStorage.setItem("bz-mode",m); }catch(e){}
  // 全部 CSS 布局完成后，再按实际画布宽高刷新相机投影。
  requestAnimationFrame(function(){updateTopHeight();resize();});
  setTimeout(resize,120);
}
document.getElementById("mStage").onclick=function(){setMode("stage")};
document.getElementById("mFull").onclick=function(){setMode("full")};

/* ---- 全屏 ---- */
// 浏览器不给全屏（比如被嵌在 iframe 里）就退一步，用整页铺满顶上去。
var fsBtn=document.getElementById("fsBtn"), faux=false;
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function fsSync(){
  var on=!!fsEl()||faux;
  fsBtn.textContent = on?"退出全屏":"全屏";
  fsBtn.setAttribute("aria-pressed",on?"true":"false");
  setTimeout(resize,120); setTimeout(resize,420);
}
function setFaux(v){ faux=v; document.documentElement.dataset.fs = v?"faux":""; fsSync(); }
function toggleFs(){
  if(fsEl()){ var ex=document.exitFullscreen||document.webkitExitFullscreen; if(ex) ex.call(document); return; }
  if(faux){ setFaux(false); return; }
  var d=document.documentElement, rq=d.requestFullscreen||d.webkitRequestFullscreen, p=null;
  if(rq){ try{ p=rq.call(d); }catch(err){ p=null; setFaux(true); return; } }
  else { setFaux(true); return; }
  if(p&&p.then) p.then(function(){},function(){ setFaux(true); });
}
fsBtn.addEventListener("click",toggleFs);
["fullscreenchange","webkitfullscreenchange"].forEach(function(t){ document.addEventListener(t,fsSync); });

var spaceDown=false;
document.addEventListener("keydown",function(e){
  if(/input|textarea/i.test(e.target.tagName)&&e.key!==" ") return;
  if(ROLE==="screen"&&e.key!=="f"&&e.key!=="F") return;   // 大屏只跟着平板走
  if(e.key==="ArrowLeft"){ e.preventDefault(); setAng(S.angle-(e.shiftKey?0.1:0.5)); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); setAng(S.angle+(e.shiftKey?0.1:0.5)); }
  else if(e.key==="PageDown"){ e.preventDefault(); go(Math.min(STEPS.length-1,S.step+1)); }
  else if(e.key==="PageUp"){ e.preventDefault(); go(Math.max(0,S.step-1)); }
  else if((e.key==="c"||e.key==="C")&&S.step===0){ S.blind=!S.blind; S.peeked=false; S.probe="idle"; lockHoleView(S.blind); STEPS[S.step].dock(); apply(); refresh(); }
  else if(e.key==="p"||e.key==="P"){ if(S.blind){S.peeked=!S.peeked; apply(); refresh();} }
  else if(e.key===" "){ e.preventDefault(); if(!spaceDown&&DOCK.querySelector('[data-act="hit"]')){spaceDown=true;startHit();} }
  else if(e.key==="f"||e.key==="F"){ e.preventDefault(); toggleFs(); }
  else if(e.key==="Escape"&&faux){ setFaux(false); }
  else if(e.key>="1"&&e.key<="2"){ go(+e.key-1); }
});
document.addEventListener("keyup",function(e){ if(e.key===" "){spaceDown=false;stopHit();} });

var saved=null; try{ saved=localStorage.getItem("bz-mode"); }catch(e){}
// 大屏永远只要画面；平板默认也先不铺讲解，屏幕留给三维
setMode(ROLE==="screen" ? "stage" : (saved ? (saved==="stage"?"stage":"full") : (TOUCHUI?"stage":"full")));
go(0);
syncStart();
})();
</script>
